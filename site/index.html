<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zach</title>
  <meta name="description" content="zach. trust in the process. dw about me.">
  <link rel="canonical" href="https://haunted.ong/">
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="haunted.ong">
  <meta property="og:title" content="zach">
  <meta property="og:description" content="trust in the process. dw about me.">
  <meta property="og:url" content="https://haunted.ong/">
  <meta property="og:image" content="https://haunted.ong/assets/pfp.webp">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="zach">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="zach">
  <meta name="twitter:description" content="trust in the process. dw about me.">
  <meta name="twitter:image" content="https://haunted.ong/assets/pfp.webp">
  <meta name="theme-color" content="#070707">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/pfp.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/Rubik-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/projects-client.css">
</head>
<body>
  <canvas class="damascus" id="damascus" aria-hidden="true"></canvas>

  <nav class="dots" aria-label="Sections">
    <a class="dot active" href="#home" data-dot="home" aria-label="Profile"><span></span></a>
    <a class="dot" href="#about" data-dot="about" aria-label="About"><span></span></a>
    <a class="dot" href="#projects" data-dot="projects" aria-label="Projects"><span></span></a>
  </nav>

  <footer class="hud">
    <a class="scroll-hint" id="scrollHint" href="#about">
      <span>Scroll for more</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
    </a>
  </footer>

  <main>
    <section id="home" class="screen hero">
      <div class="profile">
        <div class="avatar-wrap">
          <img class="avatar" id="avatar" src="/assets/pfp.webp" alt="zach" width="512" height="512" fetchpriority="high">
        </div>
        <h1 id="name">zach</h1>
        <div class="socials" id="socials"></div>
      </div>
    </section>

    <section id="about" class="screen about">
      <div class="about-inner">
        <h2>About me</h2>
        <div class="card bio" id="bio">trust in the process. dw about me.</div>
        <p class="now" id="now" hidden></p>
        <div class="about-grid">
          <a class="card presence" id="presence" target="_blank" rel="noreferrer">
            <img class="presence-pfp" src="/assets/pfp.webp" alt="" width="512" height="512" loading="lazy">
            <div>
              <div class="presence-name" id="presenceName"></div>
              <div class="presence-sub" id="presenceSub"></div>
            </div>
          </a>
          <article class="card clock-card">
            <div class="wall-clock" id="wallClock" aria-label="Local time">
              <div class="hours">
                <div class="digit"><div class="number">0</div></div>
                <div class="digit"><div class="number">0</div></div>
              </div>
              <div class="tick">:</div>
              <div class="minutes">
                <div class="digit"><div class="number">0</div></div>
                <div class="digit"><div class="number">0</div></div>
              </div>
              <div class="tick">:</div>
              <div class="seconds">
                <div class="digit"><div class="number">0</div></div>
                <div class="digit"><div class="number">0</div></div>
              </div>
            </div>
            <div class="when" id="when">Local time</div>
          </article>
        </div>
        <a class="card showcase" id="showcase" hidden></a>
        <!-- Experience: same spot the main project card had, taller. Entries come from config.js `experience`. -->
        <section class="card experience" id="experience" aria-labelledby="experienceTitle">
          <h2 class="experience-title" id="experienceTitle">Experience</h2>
          <ul class="exp-list" id="experienceList"></ul>
          <p class="exp-more">More will be added soon...</p>
        </section>
        <div class="skills" id="skills"></div>
      </div>
    </section>

    <section id="projects" class="screen projects">
      <div class="projects-inner">
        <h2 id="projectsTitle">projects i work on</h2>
        <div id="projectList"></div>
        <a class="project-more" href="/projects/">
          <span class="project-more-text">view more</span>
        </a>
      </div>
    </section>
  </main>

  <!-- the "lines of code" popup for an Experience entry (filled by app.js) -->
  <dialog class="exp-dialog" id="expDialog" aria-labelledby="expDialogTitle">
    <div class="exp-dialog-inner">
      <div class="exp-dialog-head">
        <h3 class="exp-dialog-title" id="expDialogTitle"></h3>
        <button class="exp-dialog-close" type="button" id="expDialogClose" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="exp-dialog-total" id="expDialogTotal"></p>
      <ul class="exp-changes" id="expDialogList"></ul>
    </div>
  </dialog>

  <script src="/config.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/projects-client.js"></script>
</body>
</html>
